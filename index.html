<!doctype html>
<html lang="es">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3Z52E094P6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-3Z52E094P6');
    </script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkham Voices</title>

    <meta name="theme-color" content="#120b0c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Textos narrados de Arkham Horror LCG" />

    <!-- Tema visual: se aplica ANTES de pintar para evitar parpadeo (FOUC).
         Debe ir aquí, en el <head>, antes de que cargue el CSS/JS.
         La lista y el tema por defecto deben coincidir con THEMES/DEFAULT_THEME
         de src/main.js. "green" es el tema base (:root), va sin atributo. -->
    <script>
      (function () {
        var THEMES = ["crimson", "shroud", "green", "cosmic", "light"];
        var t = null;
        try { t = localStorage.getItem("ahlcg_audio:theme"); } catch (e) {}
        if (THEMES.indexOf(t) === -1) t = "crimson";
        if (t !== "green") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Precarga del banner de portada: es lo primero que se ve al abrir la app,
         así aparece de inmediato en vez de esperar a que arranque el JS. -->
    <link rel="preload" as="image" href="./images/general_banner_01.webp" fetchpriority="high" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <!--
      Los textos en español de este HTML son solo el "arranque" (primer pintado /
      sin JS). La fuente de verdad de TODA la interfaz son los .json de i18n
      (src/i18n/<idioma>/ui.json); main.js los aplica en cuanto carga (applyStaticI18n)
      y al cambiar de idioma.
    -->
    <a class="skip-link" href="#main-content">Saltar al contenido</a>

    <div class="app">
      <div class="app-top">
        <header class="topbar">
          <div class="topbar-main-left">
            <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menú lateral" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
            <span class="topbar-emblem" aria-hidden="true">
              <!-- Símbolo arcano (pentagrama con ojo). width/height explícitos para
                   que no aparezca gigante antes de cargar el CSS (FOUC). -->
              <svg width="34" height="34" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
                <path d="M24 4 Q37.5 19.6 35.8 40.2 Q15.7 35.5 5 17.8 Q24 9.8 43 17.8 Q32.3 35.5 12.2 40.2 Q10.5 19.6 24 4 Z"/>
                <path d="M18.5 24 Q24 19.6 29.5 24 Q24 28.4 18.5 24 Z" stroke-width="1.3"/>
                <circle cx="24" cy="24" r="1.6" fill="currentColor" stroke="none"/>
              </svg>
            </span>
          </div>
          <p class="topbar-brand" aria-hidden="true"><span class="beta-badge">BETA</span></p>
          <p class="topbar-province-hint" id="topbar-province-hint" aria-live="polite">Selecciona una campaña</p>
          <div class="topbar-tools">
            <div class="theme-switcher" id="theme-switcher"></div>
            <div class="lang-switcher" id="lang-switcher"></div>
          </div>
        </header>

        <div class="music-bar" id="music-bar"></div>
        <div class="playback-bar" id="playback-bar"></div>
      </div>

      <div class="app-body">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <main class="content" id="main-content" tabindex="-1">
          <div class="content-search" id="content-search" role="search" hidden>
            <span class="content-search-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="7" cy="7" r="5"/>
                <line x1="10.8" y1="10.8" x2="14.5" y2="14.5"/>
              </svg>
            </span>
            <input
              class="content-search-input"
              id="card-search-input"
              type="search"
              inputmode="text"
              autocomplete="off"
              spellcheck="false"
              maxlength="24"
              placeholder="Buscar"
              aria-label="Buscar"
            />
          </div>
          <section class="screen-card" id="screen" aria-label="Narraciones"></section>
        </main>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
